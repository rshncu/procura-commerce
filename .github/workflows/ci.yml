name: Quality / CI

# Baseline de CI: activación exclusivamente manual.
# No hay "push" ni "pull_request" todavía: esta es la primera versión,
# pensada para dejar evidencia del estado real del repositorio antes de
# introducir contract testing (Pact) en una etapa posterior.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - api-gateway
          - product-service
          - order-service
          - microservices-backend
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npx nx test ${{ matrix.project }}
